[package]
name = "forge-ide"
version = "0.1.0"
edition = "2024"
description = "A lightweight native code editor written in Rust"
license = "MIT"
repository = "https://github.com/asofianidis/forge-ide"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
egui = "0.37"
regex = "1"
rfd = "0.17.2"
ropey = "1.6"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[profile.release]
lto = "thin"

