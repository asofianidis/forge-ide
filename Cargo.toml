[package]
name = "forge-ide"
version = "0.1.0"
edition = "2024"
description = "A lightweight native code editor written in Rust"
license = "MIT"
repository = "https://github.com/asofianidis/forge-ide"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
lsp-types = "0.97.0"
notify = "8"
portable-pty = "0.9"
regex = "1.13.1"
rfd = "0.17.2"
# Only `\n` breaks lines, matching egui's layout and the rest of the editor.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Verifying the macOS disk image an app-bundle update installs from.
sha2 = "0.11"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.2.1"
trash = "5"
url = "2.5.8"
vt100 = "0.18"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Bringing another Forge window (a separate process) to the front.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"

