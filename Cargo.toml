[package]
name = "forge-ide"
version = "0.1.0"
edition = "2024"
description = "A lightweight native code editor written in Rust"
license = "MIT"
repository = "https://github.com/asofianidis/forge-ide"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
regex = "1.13.1"
rfd = "0.17.2"
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.2.1"

[profile.release]
lto = "thin"

