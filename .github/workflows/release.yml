name: Release

# Every push to main publishes a release. The version is the major.minor
# from Cargo.toml plus this workflow's run number as the patch, e.g.
# 0.1.42 -> tag v0.1.42. Bump major/minor in Cargo.toml to start a new
# series. The in-app updater (src/updater.rs) installs these releases.
# Running it by hand on another branch builds, signs and notarizes
# everything without publishing; the builds are kept as run artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Compute version
        id: version
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | cut -d. -f1,2)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            mac_arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            mac_arch: x64
    env:
      FORGE_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      # macOS ships two things, both signed with the Developer ID certificate
      # (hardened runtime + secure timestamp) and notarized by Apple:
      #  - Forge-IDE-v<version>-macos-<arch>.dmg holding "Forge IDE.app", for
      #    people to download. The app and the disk image both have their
      #    notarization ticket stapled, so Gatekeeper accepts them offline.
      #  - the bare forge-ide binary in the .tar.gz, for the in-app updater on
      #    installs that aren't an app bundle. A bare executable can't carry a
      #    stapled ticket; Gatekeeper has to look it up online, which is why
      #    the DMG is what people should download.
      # The DMG's name avoids the target triple so the bare-binary updater
      # never mistakes it for its .tar.gz.
      - name: Sign, notarize and bundle (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_ARCH: ${{ matrix.mac_arch }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/forge-ide"
          work="$RUNNER_TEMP/macos"
          mkdir -p "$work" "$GITHUB_WORKSPACE/dist"

          # Import the certificate into a throwaway keychain.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # The .p12 holds only the leaf certificate; codesign needs the
          # Developer ID G2 intermediate to treat the identity as valid.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"
            exit 1
          fi

          sign() {
            codesign --force --options runtime --timestamp \
              --identifier dev.forge-ide.forge-ide \
              --keychain "$keychain" --sign "$identity" "$@"
          }

          # Submits a file (zip or dmg) and fails unless Apple accepts it.
          notarize() {
            local result id status
            result=$(xcrun notarytool submit "$1" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m --output-format json)
            echo "$result"
            id=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            status=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              echo "::error::Notarization of $(basename "$1") failed with status: $status"
              exit 1
            fi
          }

          # The bare binary, for the .tar.gz.
          sign "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # The app bundle around a copy of it, signed as a bundle.
          app="$work/Forge IDE.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin" "$app/Contents/MacOS/forge-ide"
          sed "s/@VERSION@/${FORGE_VERSION}/g" packaging/macos/Info.plist \
            > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          sign "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # Notarize both in one submission (notarytool takes a zip), then
          # staple the app's ticket so it works offline once copied out.
          mkdir "$work/submit"
          ditto "$app" "$work/submit/Forge IDE.app"
          cp "$bin" "$work/submit/forge-ide"
          ditto -c -k --keepParent "$work/submit" "$work/notarize.zip"
          notarize "$work/notarize.zip"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          # The disk image: the app plus an Applications shortcut to drag it to.
          dmg="$GITHUB_WORKSPACE/dist/Forge-IDE-v${FORGE_VERSION}-macos-${MAC_ARCH}.dmg"
          mkdir "$work/dmg"
          ditto "$app" "$work/dmg/Forge IDE.app"
          ln -s /Applications "$work/dmg/Applications"
          hdiutil create -volname "Forge IDE" -srcfolder "$work/dmg" \
            -fs HFS+ -format UDZO -ov "$dmg"
          codesign --force --timestamp --keychain "$keychain" --sign "$identity" "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - name: Package
        shell: bash
        run: |
          name="forge-ide-v${FORGE_VERSION}-${{ matrix.target }}"
          cd "target/${{ matrix.target }}/release"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/dist/${name}.zip" forge-ide.exe
          else
            tar czf "$GITHUB_WORKSPACE/dist/${name}.tar.gz" forge-ide
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Forge IDE ${VERSION}" \
            --generate-notes
